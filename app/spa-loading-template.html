<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RhyseForge</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(720px 340px at 50% 52%, rgba(17, 137, 121, 0.52), transparent 70%),
          radial-gradient(900px 420px at 50% 50%, rgba(8, 27, 66, 0.75), transparent 78%),
          linear-gradient(155deg, #02162b 0%, #041026 55%, #07162f 100%);
        color: #f5f7ff;
      }

      .loader-shell {
        display: inline-flex;
        align-items: center;
        gap: 0.85rem;
        padding: 1.1rem 1.4rem;
        border-radius: 1rem;
        border: 1px solid rgba(148, 163, 184, 0.24);
        background: rgba(10, 23, 46, 0.56);
        backdrop-filter: blur(8px);
        box-shadow: 0 20px 40px -26px rgba(34, 211, 238, 0.45);
      }

      .logo-dot {
        width: 0.9rem;
        height: 0.9rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #4f46e5 0%, #22d3ee 100%);
        animation: pulse 1.2s ease-in-out infinite;
      }

      .brand {
        font-weight: 800;
        letter-spacing: 0.02em;
        font-size: clamp(1.55rem, 3.1vw, 2.2rem);
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.78;
        }
        50% {
          transform: scale(1.22);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="loader-shell" aria-label="Loading RhyseForge">
      <span class="logo-dot"></span>
      <span class="brand">RhyseForge</span>
    </div>
  </body>
</html>
